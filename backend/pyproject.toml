[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscrapper-api"
version = "0.1.0"
description = "Local FastAPI service for JobScrapper"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pypdf>=4.0,<6.0",
  "python-docx>=1.1,<2.0",
]

[project.scripts]
jobscrapper-api = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
